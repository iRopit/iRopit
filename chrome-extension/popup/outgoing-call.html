<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outgoing Call — iRopit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #fff;
      width: 340px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 20px;
      padding-bottom: 16px;
      gap: 0;
      overflow: hidden;
      user-select: none;
    }

    /* Animated ring */
    .avatar-ring {
      position: relative;
      margin-bottom: 16px;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(10, 132, 255, 0.4);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse-ring 1.6s ease-out infinite;
    }

    .ring:nth-child(1) { width: 72px; height: 72px; animation-delay: 0s; }
    .ring:nth-child(2) { width: 88px; height: 88px; animation-delay: 0.4s; }
    .ring:nth-child(3) { width: 104px; height: 104px; animation-delay: 0.8s; }

    @keyframes pulse-ring {
      0%   { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0;   transform: translate(-50%, -50%) scale(1.25); }
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0a84ff, #007aff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.3);
    }

    .call-label {
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0a84ff;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(10, 132, 255, 0.5);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .contact-name {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      max-width: 320px;
      word-break: break-word;
      line-height: 1.25;
    }

    .phone-number {
      font-size: 14px;
      color: #aaa;
      margin-top: 3px;
      letter-spacing: 0.03em;
    }

    .meta-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .meta-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      color: #ccc;
    }

    .meta-badge svg { flex-shrink: 0; }

    .actions {
      display: flex;
      gap: 32px;
      margin-top: 20px;
      align-items: center;
    }

    .btn-decline {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ff3b30;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s;
      box-shadow: 0 4px 14px rgba(255,59,48,0.5);
    }

    .btn-decline:hover { background: #e0352a; transform: scale(1.08); }
    .btn-decline:active { transform: scale(0.96); }

    .btn-label {
      font-size: 11px;
      color: #888;
      text-align: center;
      margin-top: 6px;
    }

    .btn-group { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>

  <div class="call-label">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 7 23 1 17 1"/>
      <line x1="16" y1="8" x2="23" y2="1"/>
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
    </svg>
    <span>Outgoing Call</span>
  </div>

  <div class="avatar-ring">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="avatar" id="avatar">?</div>
  </div>

  <div class="contact-name" id="contactName">Unknown</div>
  <div class="phone-number" id="phoneNumber"></div>

  <div class="meta-row" id="metaRow"></div>

  <div class="actions">
    <div class="btn-group">
      <button class="btn-decline" id="dismissBtn" title="Dismiss">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <span class="btn-label">Dismiss</span>
    </div>
  </div>

  <script src="outgoing-call.js"></script>
</body>
</html>
